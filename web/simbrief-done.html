<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimBrief plan ready</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B1524;color:#E9EEF5;font:15px system-ui,"Segoe UI",sans-serif}p{margin:0;padding:24px;text-align:center}</style>
</head><body><p id="msg">Your flight plan is ready. Returning to Charter Desk FS…</p>
<script>
  // SimBrief sends the pilot here when the plan is generated. Hand the plan reference back to the planner.
  (function () {
    var ps = new URLSearchParams(location.search), id = ps.get('ofp_id') || ps.get('ofpid') || (location.hash.match(/ofp_id=([\w]+)/) || [])[1];
    var trip = null; try { trip = localStorage.getItem('sbTrip') } catch (e) {}
    if (!id) { document.getElementById('msg').textContent = 'SimBrief didn\'t send a plan reference. Close this window and press "Load my latest SimBrief plan".'; return; }
    if (window.opener && !window.opener.closed) {
      try { window.opener.postMessage({ sbOfp: id, trip: trip }, location.origin); } catch (e) {}
      setTimeout(function () { window.close(); }, 300);
    } else {
      location.replace('index.html?sb_ofp=' + encodeURIComponent(id) + (trip ? '&trip=' + encodeURIComponent(trip) : '') + '#trips');
    }
  })();
</script></body></html>
