<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charter Desk FS</title>
<meta name="theme-color" content="#0E1A2B">
<script>try{var t=localStorage.getItem("cd-theme");if(t&&t!=="system")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top" hidden><div class="wrap">
  <div class="toprow">
    <div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 28 L14 6 L20 6 L16 20 L28 20 L28 28 Z" fill="#D4B06A"></path></svg><div class="bt"><b>Charter Desk <span>FS</span></b><small id="coName"></small></div></div>
    <div class="gauges">
      <div class="gauge cash"><label>Balance</label><span id="gCash"></span></div>
      <div class="gauge"><label>Reputation</label><span id="gRep"></span><div class="repbar"><i id="gRepBar"></i></div></div>
      <div class="gauge"><label id="gLocalLabel">Local</label><span id="gLocal"></span></div>
      <div class="gauge"><label>UTC</label><span id="gUtc"></span></div>
      <button class="iconbtn" id="themeBtn" data-act="theme" type="button" title="Switch between automatic, light and dark">Theme: auto</button>
      <button class="iconbtn" id="soundBtn" data-act="sound" type="button">Ringer off</button>
      <button class="iconbtn" data-act="signout" type="button">Sign out</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="call"></div>
<div id="cabin"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="vendor/tz.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
