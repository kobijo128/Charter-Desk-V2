name: Build tracker

on:
  push:
    paths: ['tracker/**', '.github/workflows/build-tracker.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: >
          dotnet publish tracker/CharterDeskTracker.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Screenshot check
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/CharterDeskTracker.exe -ArgumentList '--screenshot', "$PWD/tracker-screenshot.png" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Tracker did not exit' }
          if (-not (Test-Path tracker-screenshot.png)) { throw 'No screenshot written' }
      - uses: actions/upload-artifact@v4
        with:
          name: CharterDeskTracker
          path: out/CharterDeskTracker.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-screenshot
          path: tracker-screenshot.png
      - name: Keep the screenshot on the ci-screens branch (test builds only)
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          Move-Item tracker-screenshot.png $env:RUNNER_TEMP/shot.png -Force
          git fetch origin ci-screens 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -f -B ci-screens FETCH_HEAD } else { git checkout --orphan ci-screens; git rm -rf . -q }
          $global:LASTEXITCODE = 0
          Copy-Item $env:RUNNER_TEMP/shot.png tracker-screenshot.png -Force
          git add tracker-screenshot.png
          git commit -m "Tracker screenshot from $env:GITHUB_SHA" --allow-empty -q
          git push -f origin ci-screens -q
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-latest
          name: Charter Desk Tracker (latest)
          prerelease: false
          make_latest: true
          files: out/CharterDeskTracker.exe
